<!DOCTYPE html>
<html lang="en" data-theme="ink">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(function () {
        var theme = localStorage.getItem('theme') || 'ink'
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.lang = theme === 'zhu' ? 'zh-CN' : 'en'
      })()
    </script>
    <link rel="icon" type="image/png" href="/Images/zhu-favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kailiang (Bill) Zhu — personal portfolio and projects." />
    <title>billzhu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function () {
        var redirect = sessionStorage.getItem('redirect')
        if (redirect) {
          sessionStorage.removeItem('redirect')
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
